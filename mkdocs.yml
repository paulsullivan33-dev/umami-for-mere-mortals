site_name: Umami for Mere Mortals
site_description: Self-hosted web analytics that respects your visitors. Counting page views, referrers and browsers with no cookies and no personal data, stored in a PostgreSQL database you own, and read through a dashboard or an API, with the limits stated plainly.
